<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1217">
<title>CodeWise</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=__V__">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-set" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
<symbol id="i-step" viewBox="0 0 24 24"><path d="M5 4l10 8-10 8zM19 5v14"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4h6v2"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6M3 13a9 9 0 1 0 3-7.7L3 8"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l-1 7 3 3H7l3-3z"/></symbol>
<symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></symbol>
<symbol id="i-brush" viewBox="0 0 24 24"><path d="M18.4 2.6a2 2 0 0 1 3 3L11 16l-4 1 1-4zM7 17c-2 0-3 1.5-3 3.5 1.7 0 3.5-.5 3.5-2.5"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 2l10 5-10 5L2 7zM2 12l10 5 10-5M2 17l10 5 10-5"/></symbol>
<symbol id="i-code" viewBox="0 0 24 24"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.6"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M15.5 14.8c3 0 5.5 1.7 5.5 4.7"/></symbol>
</defs></svg>

<header>
  <button class="proj" id="projBtn"><span id="projName">…</span><svg class="ic"><use href="#i-chev"/></svg></button>
  <div class="tabs" id="tabs"><button data-v="chat" class="on">گفتگو</button><button data-v="team">تیم</button><button data-v="files">فایل‌ها</button><button data-v="pv">پیش‌نمایش</button></div>
  <button class="ib" id="setBtn" aria-label="تنظیمات"><svg class="ic"><use href="#i-set"/></svg></button>
</header>

<main>
  <section class="pane on" id="v-chat">
    <div id="msgs" aria-live="polite"></div>
    <button class="jump" id="jump" hidden aria-label="رفتن به آخر"><svg class="ic"><use href="#i-down"/></svg></button>
    <div id="dock">
      <div class="comp">
        <textarea id="inp" rows="1"></textarea>
        <div class="cr"><button class="pill" id="modeBtn"></button><span class="mu" id="model" style="font-size:11.5px"></span><button class="go" id="go" aria-label="ارسال"></button></div>
      </div>
    </div>
  </section>
  <section class="pane" id="v-team"><div id="du"></div></section>
  <section class="pane" id="v-files">
    <div class="bar"><input id="ffilter" placeholder="جستجوی فایل…"><button class="btn" id="fnew" title="فایل جدید"><svg class="ic"><use href="#i-plus"/></svg></button><button class="btn" id="fup" title="آپلود"><svg class="ic"><use href="#i-up"/></svg></button><button class="btn" id="fzip" title="دانلود zip"><svg class="ic"><use href="#i-down"/></svg></button></div>
    <div id="flist"></div>
  </section>
  <section class="pane" id="v-pv">
    <div class="bar"><button class="btn p" id="pvr"><svg class="ic"><use href="#i-refresh"/></svg>بارگذاری دوباره</button><span class="mu" id="pvm" style="font-size:12.5px"></span></div>
    <iframe id="pvf" title="پیش‌نمایش" sandbox="allow-scripts allow-forms allow-modals"></iframe>
  </section>
</main>

<div class="ov" id="ovProj"><div class="sh"><h3>پروژه‌ها<button class="ib" data-close aria-label="بستن"><svg class="ic"><use href="#i-x"/></svg></button></h3><div id="plist" class="col"></div><button class="btn p" id="pnew" style="justify-content:center"><svg class="ic"><use href="#i-plus"/></svg>پروژه‌ی جدید</button></div></div>

<div class="ov" id="ovMode"><div class="sh"><h3>حالت کار ایجنت<button class="ib" data-close aria-label="بستن"><svg class="ic"><use href="#i-x"/></svg></button></h3><div id="mlist" class="col"></div></div></div>

<div class="ov" id="ovSet"><div class="sh">
  <h3>تنظیمات پروژه<button class="ib" data-close aria-label="بستن"><svg class="ic"><use href="#i-x"/></svg></button></h3>
  <div class="mu" style="font-size:12.5px">قوانین پروژه؛ همه‌ی ایجنت‌ها همیشه رعایتشون می‌کنن (زبان، سبک کد، کتابخانه‌های مجاز…)</div>
  <textarea id="rules" placeholder="مثلاً: همیشه کامنت انگلیسی، بدون وابستگی اضافه، تست هم بنویس"></textarea>
  <div class="grid"><button class="btn p" id="rsave">ذخیره</button><button class="btn" id="rname">تغییر نام</button><button class="btn" id="tsend">ارسال zip به تلگرام</button><button class="btn" id="theme"><svg class="ic"><use href="#i-moon"/></svg>تم</button><button class="btn d" id="cclr">پاک کردن گفتگو</button><button class="btn d" id="pdel">حذف پروژه</button></div>
  <div class="sec">نسخه‌های پشتیبان <span class="mu">(قبل از هر کار ایجنت خودکار)</span></div>
  <div id="snaps" class="col"></div>
</div></div>

<div class="ov" id="ovTeam"><div class="sh" id="tsh"></div></div>

<div class="ov" id="dlg" style="align-items:center"><div class="sh" style="border-radius:16px;max-width:360px"><b id="dlt"></b><input id="dli"><div class="grid"><button class="btn p" id="dlo">تأیید</button><button class="btn" id="dlc">انصراف</button></div></div></div>

<div id="ed"><div class="t"><button class="ib" id="edx" aria-label="بستن"><svg class="ic"><use href="#i-x"/></svg></button><span id="edp" class="ltr"></span><button class="btn" id="edr"><svg class="ic"><use href="#i-play"/></svg>اجرا</button><button class="btn p" id="eds">ذخیره</button><button class="btn d" id="edd" aria-label="حذف"><svg class="ic"><use href="#i-trash"/></svg></button></div><textarea id="edt" spellcheck="false"></textarea><pre id="edo" hidden></pre></div>
<input type="file" id="fin" multiple hidden>
<div id="toast" role="status"></div>
<script src="/static/app.js?v=__V__"></script>
<script src="/static/duo.js?v=__V__"></script>
</body>
</html>
